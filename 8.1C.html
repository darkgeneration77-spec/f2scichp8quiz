<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Form 2 Science 8.1C</title><style>body{margin:0;background:#07111d;color:#f5f8fb;font-family:Inter,Segoe UI,Arial,sans-serif}.wrap{max-width:980px;margin:auto;padding:20px}.top,.card{border:1px solid #2c4d68;background:#0b1b2d;border-radius:18px;padding:16px;margin-bottom:14px}.start{display:flex;gap:8px;flex-wrap:wrap}input{padding:11px;border-radius:10px;border:1px solid #35556f;background:#091827;color:#fff}.btn,.opt{border:0;border-radius:10px;padding:11px 13px;font-weight:800;cursor:pointer}.btn{background:#68d4ff;color:#04111b}.opt{background:#10243b;color:#fff;border:1px solid #31516d;text-align:left}.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}.good{background:#153b2b!important}.bad{background:#3b1d26!important}.scene{height:280px;display:grid;place-items:center}.fb{margin-top:10px;padding:12px;border-radius:12px;background:#0b2034}.hide{display:none}.wrong{margin:8px 0;padding:12px;border:1px solid #304d66;border-radius:12px}@media(max-width:700px){.opts{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="top"><h1>8.1C — Measuring Force</h1><p>Spring balance · Newton (N) · Scale reading</p><div class="start"><input id="studentCode" placeholder="Student ID"><input id="name" placeholder="Student name"><input id="className" placeholder="Class"><button class="btn" onclick="start()">Start</button></div></div><div id="game" class="card hide"><div id="scene" class="scene"></div><h2 id="question"></h2><div id="opts" class="opts"></div><div id="fb" class="fb hide"></div><button id="next" class="btn hide" onclick="nextQ()">Next</button></div><div id="res" class="card hide"><h2 id="score"></h2><div id="wrong"></div></div></div><script src="chapter8-performance.js"></script><script>
function scale(r){const y=55+r/5*160;return `<svg viewBox="0 0 520 290"><rect x="195" y="20" width="130" height="235" rx="22" fill="#eaf4fb" stroke="#789ab6" stroke-width="5"/><rect x="225" y="42" width="80" height="185" rx="8" fill="white"/><line x1="260" y1="55" x2="260" y2="215" stroke="#172536" stroke-width="4"/>${[0,1,2,3,4,5].map(v=>{let yy=55+v/5*160;return `<line x1="260" y1="${yy}" x2="288" y2="${yy}" stroke="#172536" stroke-width="3"/><text x="296" y="${yy+6}" fill="#172536" font-size="15" font-weight="800">${v}</text>`}).join("")}<circle cx="260" cy="${y}" r="8" fill="#ff6f61"/><text x="355" y="145" fill="#bfefff" font-size="20" font-weight="900">N</text></svg>`}
const S={instrument:scale(2),friction:`<svg viewBox="0 0 520 290"><rect x="80" y="210" width="360" height="20" rx="8" fill="#4c7393"/><rect x="110" y="150" width="100" height="60" rx="10" fill="#ffd166"/><path d="M210 180 H320" stroke="#9adf78" stroke-width="7"/><rect x="320" y="135" width="65" height="90" rx="12" fill="#eaf4fb" stroke="#789ab6" stroke-width="4"/><text x="352" y="180" text-anchor="middle" fill="#172536" font-size="16" font-weight="900">SPRING</text><text x="352" y="198" text-anchor="middle" fill="#172536" font-size="16" font-weight="900">BALANCE</text></svg>`};
const Q=[
{topic:"Instrument",scene:"instrument",q:"Which instrument is used to measure force?",opts:["Thermometer","Spring balance","Measuring cylinder","Stopwatch"],a:1,exp:"测量力使用<strong>spring balance</strong>。"},
{topic:"Unit",scene:"instrument",q:"What is the S.I. unit of force?",opts:["kg","N","m","s"],a:1,exp:"力的 S.I. unit 是<strong>newton (N)</strong>。"},
{topic:"Unit",scene:"instrument",q:"The symbol N stands for...",opts:["Normal","Newton","Number","Net"],a:1,exp:"N 是 newton 的符号。"},
{topic:"Instrument",scene:"friction",q:"Which instrument can measure the pulling force on this block?",opts:["Spring balance","Metre rule","Ammeter","Beaker"],a:0,exp:"拉力可用 spring balance 测量。"},
{topic:"Concept",scene:"instrument",q:"Which quantity is measured in newtons?",opts:["Mass","Force","Time","Length"],a:1,exp:"Newton 是 force 的单位。"},
{topic:"Concept",scene:"instrument",q:"A spring balance reads 3 N. What does 3 N represent?",opts:["Mass","Force magnitude","Length","Time"],a:1,exp:"3 N 表示 force magnitude。"},
{topic:"Reading",svg:scale(2),q:"Read the spring balance.",opts:["1 N","2 N","3 N","4 N"],a:1,exp:"指针在 2 N。"},
{topic:"Reading",svg:scale(3),q:"What is the force reading shown?",opts:["2 N","3 N","4 N","5 N"],a:1,exp:"指针在 3 N。"},
{topic:"Reading",svg:scale(1),q:"What is the spring balance reading?",opts:["1 N","2 N","3 N","4 N"],a:0,exp:"指针在 1 N。"},
{topic:"Reading",svg:scale(4),q:"Which reading is correct?",opts:["3 N","4 N","5 N","40 N"],a:1,exp:"正确读数是 4 N。"},
{topic:"Unit",svg:scale(1),q:"Which is the correct way to record this force measurement?",opts:["1 kg","1 N","1 m","1 s"],a:1,exp:"Spring balance 测 force，所以单位是 N。"},
{topic:"Weight relation",scene:"instrument",q:"Using the textbook approximation, 100 g has a weight of approximately...",opts:["0.1 N","1 N","10 N","100 N"],a:1,exp:"课本常用近似关系<strong>100 g ≈ 1 N</strong>。"},
{topic:"Weight relation",scene:"instrument",q:"Using the textbook approximation, what is the weight of 300 g?",opts:["0.3 N","3 N","30 N","300 N"],a:1,exp:"300 g ≈ 3 N。"},
{topic:"Weight relation",scene:"instrument",q:"A 500 g object has a weight of approximately...",opts:["0.5 N","5 N","50 N","500 N"],a:1,exp:"500 g ≈ 5 N。"},
{topic:"Weight relation",scene:"instrument",q:"An object weighs about 4 N. Its mass is about...",opts:["40 g","400 g","4 g","4000 g"],a:1,exp:"4 N ≈ 400 g。"},
{topic:"Application",scene:"friction",q:"This setup can be used to investigate which force?",opts:["Frictional force","Buoyant force","Planetary gravity","Magnetic force"],a:0,exp:"拉动物体并读 spring balance 可研究 frictional force。"},
{topic:"Technique",scene:"instrument",q:"Before taking a reading, what should you check first?",opts:["Object colour","Scale and unit","Room temperature only","Mass unit only"],a:1,exp:"先检查<strong>scale and unit</strong>。"},
{topic:"Concept",scene:"instrument",q:"Which statement is correct?",opts:["Spring balance measures mass in kg","Spring balance measures force in N","Spring balance measures time","Spring balance measures volume"],a:1,exp:"Spring balance 测 force，单位 N。"},
{topic:"Reading",svg:scale(3),q:"A student records this reading as 3 kg. What is wrong?",opts:["The number is wrong","The unit is wrong; it should be N","The direction is wrong","Nothing"],a:1,exp:"数值可对，但单位应为 N，不是 kg。"},
{topic:"All",scene:"instrument",q:"Which pair is correct?",opts:["Force — newton — spring balance","Mass — newton — stopwatch","Force — kilogram — thermometer","Time — newton — spring balance"],a:0,exp:"Force 用 spring balance 测量，单位 newton (N)。"}
];
let order=[...Q],idx=0,score=0,wrong=[],attemptLog=[];function start(){const nm=name.value.trim()||"Student",code=studentCode.value.trim(),cls=className.value.trim();if(!code){alert("Please enter Student ID.");return}CH8Performance.saveIdentity(code,nm,cls);idx=0;score=0;wrong=[];attemptLog=[];game.classList.remove("hide");res.classList.add("hide");render()}function render(){if(idx>=order.length)return finish();const x=order[idx];scene.innerHTML=x.svg||S[x.scene];question.textContent=x.q;opts.innerHTML="";x.opts.forEach((v,i)=>{const b=document.createElement("button");b.className="opt";b.textContent=v;b.onclick=()=>ans(i,b);opts.appendChild(b)});fb.classList.add("hide");next.classList.add("hide")}function ans(c,b){const x=order[idx],bs=[...document.querySelectorAll(".opt")];bs.forEach(z=>z.disabled=true);bs[x.a].classList.add("good");const ok=c===x.a;if(ok)score++;else{b.classList.add("bad");wrong.push({...x,chosen:x.opts[c]})}attemptLog.push({question_id:String(idx+1),topic:x.topic,skill_type:/Reading/.test(x.topic)?"diagram":/Application/.test(x.topic)?"application":"concept",question_text:x.q,student_answer:x.opts[c],correct_answer:x.opts[x.a],is_correct:ok,explanation:x.exp});fb.classList.remove("hide");fb.innerHTML=`<b>${ok?"Correct":"Incorrect"}</b><br>正确答案：${x.opts[x.a]}<br>${x.exp}`;next.classList.remove("hide")}function nextQ(){idx++;render()}function finish(){game.classList.add("hide");res.classList.remove("hide");const p=Math.round(score/order.length*100);document.getElementById("score").textContent=`${score}/${order.length} · ${p}%`;const ident=CH8Performance.student();CH8Performance.submit({student_code:ident.student_code,student_name:ident.student_name,class_name:ident.class_name,module_code:"8.1C",module_title:"Measuring Force",score,total_questions:order.length,percentage:p,question_results:attemptLog});wrong.innerHTML=wrong.length?wrong.map((x,i)=>`<div class="wrong"><b>${i+1}. ${x.q}</b><br>Your answer: ${x.chosen}<br>Correct: ${x.opts[x.a]}<br>${x.exp}</div>`).join(""):"No wrong answers.";localStorage.setItem("f2_81c_last",JSON.stringify({score,total:order.length,p,date:new Date().toISOString()}))}window.onload=()=>{studentCode.value=localStorage.getItem("ch8_student_code")||"";name.value=localStorage.getItem("ch8_student_name")||"";className.value=localStorage.getItem("ch8_class_name")||""}
</script></body></html>
