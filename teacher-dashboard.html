<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chapter 8 Teacher Dashboard</title><style>body{margin:0;background:#07111d;color:#f5f8fb;font-family:Inter,Segoe UI,Arial,sans-serif}.wrap{max-width:1180px;margin:auto;padding:20px}.top,.panel,.card{border:1px solid #2c4d68;background:#0b1b2d;border-radius:18px;padding:16px}.top{margin-bottom:18px}.config{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin:12px 0}input{padding:11px;border-radius:10px;border:1px solid #35556f;background:#091827;color:#fff}button{border:0;border-radius:10px;padding:11px 13px;font-weight:800;cursor:pointer;background:#68d4ff;color:#04111b}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}.big{font-size:2rem;font-weight:900}.small{color:#a9bfd3;font-size:.84rem}.panel{margin-top:14px;overflow:auto}table{width:100%;border-collapse:collapse;min-width:760px}th,td{padding:9px;border-bottom:1px solid #233f58;text-align:left}th{color:#bfefff}.route{border:1px solid #304d66;border-radius:12px;padding:12px;margin:8px 0;background:#091827}.good{color:#6bdd97}.mid{color:#ffd166}.bad{color:#ff7777}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tab{background:#142a43;color:#fff}.tab.active{background:#68d4ff;color:#04111b}.hide{display:none!important}@media(max-width:800px){.cards{grid-template-columns:1fr 1fr}.config{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="top"><div class="small">FORM 2 SCIENCE · CHAPTER 8</div><h1>Teacher Analytics Dashboard</h1><div class="config"><input id="api" placeholder="https://your-worker.workers.dev"><input id="key" type="password" placeholder="Teacher key"><button onclick="saveConfig()">Save & Load</button></div></div><div class="tabs"><button class="tab active" onclick="show('students',this)">Students</button><button class="tab" onclick="show('class',this)">Class Weakness</button><button class="tab" onclick="show('student',this)">Student Analysis</button></div><section id="students"><div class="cards"><div class="card"><div class="small">STUDENTS</div><div class="big" id="studentCount">0</div></div><div class="card"><div class="small">ATTEMPTS</div><div class="big" id="attemptCount">0</div></div><div class="card"><div class="small">LATEST</div><div id="latest">—</div></div><div class="card"><div class="small">SYSTEM</div><div id="status">Not connected</div></div></div><div class="panel"><table><thead><tr><th>Student</th><th>ID</th><th>Class</th><th>Attempts</th><th>Last Activity</th><th></th></tr></thead><tbody id="studentsBody"></tbody></table></div></section><section id="class" class="hide"><div class="panel"><h2>Class Weak Areas</h2><div id="classWeak"></div></div></section><section id="student" class="hide"><div class="panel"><h2 id="studentTitle">Student Analysis</h2><div id="summary" class="cards"></div><h3>Module Mastery</h3><div id="modules"></div><h3>Weakness Diagnosis</h3><div id="weak"></div><h3>Wrong Questions</h3><div id="wrong"></div></div></section></div><script>
let API='',KEY='';function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function cls(p){return p>=85?'good':p>=70?'mid':'bad'}function saveConfig(){API=api.value.trim().replace(/\/$/,'');KEY=key.value.trim();localStorage.setItem('ch8_api',API);localStorage.setItem('ch8_teacher_key',KEY);loadStudents()}async function call(path){const r=await fetch(API+path,{headers:{'X-Teacher-Key':KEY}}),d=await r.json();if(!r.ok)throw new Error(d.error||'API error');return d}function show(id,b){['students','class','student'].forEach(x=>document.getElementById(x).classList.toggle('hide',x!==id));document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');if(id==='class')loadClass()}
async function loadStudents(){try{const d=await call('/api/students'),a=d.students||[];status.textContent='Connected';studentCount.textContent=a.length;attemptCount.textContent=a.reduce((s,x)=>s+Number(x.total_attempts||0),0);const last=a.map(x=>x.last_activity).filter(Boolean).sort().reverse()[0];latest.textContent=last||'—';studentsBody.innerHTML=a.map(x=>`<tr><td>${esc(x.student_name)}</td><td>${esc(x.student_code)}</td><td>${esc(x.class_name||'')}</td><td>${x.total_attempts||0}</td><td>${x.last_activity||'—'}</td><td><button onclick='loadStudent(${JSON.stringify(x.student_code)})'>Analyse</button></td></tr>`).join('')}catch(e){status.textContent=e.message}}
async function loadClass(){try{const d=await call('/api/class-overview'),w=d.weak_areas||[];classWeak.innerHTML=w.length?w.map(x=>`<div class="route"><b>${esc(x.topic)} · ${esc(x.skill_type)}</b><div>Accuracy: <span class="${cls(Number(x.accuracy))}">${x.accuracy}%</span> · Wrong ${x.wrong_count}/${x.total_questions}</div></div>`).join(''):'No data yet.'}catch(e){classWeak.textContent=e.message}}
function remedy(x){const s=(x.skill_type||'').toLowerCase();if(s.includes('calculation'))return'Redo calculation questions and show the formula before substituting values.';if(s.includes('diagram'))return'Redo diagram-reading questions and identify the English science keywords first.';if(s.includes('application'))return'Revise the core rule, then practise application questions.';if(Number(x.accuracy)<50)return'Relearn the core concept from Stage 1 before retrying.';return'Redo this weak concept and complete correction questions.'}
async function loadStudent(code){try{const d=await call('/api/student-report?student_code='+encodeURIComponent(code)),a=d.attempts||[],avg=a.length?Math.round(a.reduce((s,x)=>s+Number(x.percentage),0)/a.length):0,mastered=a.filter(x=>Number(x.percentage)>=80).length;studentTitle.textContent=d.student.student_name+' · '+d.student.student_code;summary.innerHTML=`<div class="card"><div class="small">MODULES DONE</div><div class="big">${a.length}</div></div><div class="card"><div class="small">AVERAGE</div><div class="big ${cls(avg)}">${avg}%</div></div><div class="card"><div class="small">MASTERED</div><div class="big">${mastered}</div></div><div class="card"><div class="small">CLASS</div><div>${esc(d.student.class_name||'—')}</div></div>`;modules.innerHTML=`<table><thead><tr><th>Module</th><th>Score</th><th>Status</th><th>Date</th></tr></thead><tbody>${a.map(x=>`<tr><td>${esc(x.module_code)} · ${esc(x.module_title)}</td><td class="${cls(Number(x.percentage))}">${x.percentage}%</td><td>${esc(x.mastery_status)}</td><td>${x.attempted_at}</td></tr>`).join('')}</tbody></table>`;const w=(d.weakness||[]).slice(0,10);weak.innerHTML=w.length?w.map((x,i)=>`<div class="route"><b>Priority ${i+1}: ${esc(x.topic)} · ${esc(x.skill_type)}</b><div>Accuracy ${x.accuracy}%</div><div class="small">${remedy(x)}</div></div>`).join(''):'No weakness data.';wrong.innerHTML=(d.wrong_questions||[]).length?d.wrong_questions.map(x=>`<div class="route"><b>${esc(x.module_code)} · ${esc(x.topic||'')}</b><div>${esc(x.question_text)}</div><div class="bad">Student: ${esc(x.student_answer||'')}</div><div class="good">Correct: ${esc(x.correct_answer)}</div><div>${x.explanation||''}</div></div>`).join(''):'No wrong questions recorded.';document.querySelectorAll('.tab')[2].click()}catch(e){alert(e.message)}}
window.onload=()=>{API=localStorage.getItem('ch8_api')||'';KEY=localStorage.getItem('ch8_teacher_key')||'';api.value=API;key.value=KEY;if(API&&KEY)loadStudents()}
</script></body></html>
