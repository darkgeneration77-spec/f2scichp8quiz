<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Form 2 Science 8.1B</title><style>body{margin:0;background:#07111d;color:#f5f8fb;font-family:Inter,Segoe UI,Arial,sans-serif}.wrap{max-width:980px;margin:auto;padding:20px}.top,.card{border:1px solid #2c4d68;background:#0b1b2d;border-radius:18px;padding:16px;margin-bottom:14px}.start{display:flex;gap:8px;flex-wrap:wrap}input{padding:11px;border-radius:10px;border:1px solid #35556f;background:#091827;color:#fff}.btn,.opt{border:0;border-radius:10px;padding:11px 13px;font-weight:800;cursor:pointer}.btn{background:#68d4ff;color:#04111b}.opt{background:#10243b;color:#fff;border:1px solid #31516d;text-align:left}.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}.good{background:#153b2b!important}.bad{background:#3b1d26!important}.scene{height:260px;display:grid;place-items:center}.fb{margin-top:10px;padding:12px;border-radius:12px;background:#0b2034}.hide{display:none}.wrong{margin:8px 0;padding:12px;border:1px solid #304d66;border-radius:12px}@media(max-width:700px){.opts{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="top"><h1>8.1B — Magnitude, Direction & Point of Application</h1><p>English questions · 华语详细解释</p><div class="start"><input id="studentCode" placeholder="Student ID"><input id="name" placeholder="Student name"><input id="className" placeholder="Class"><button class="btn" onclick="start()">Start</button></div></div><div id="game" class="card hide"><div id="scene" class="scene"></div><h2 id="question"></h2><div id="opts" class="opts"></div><div id="fb" class="fb hide"></div><button id="next" class="btn hide" onclick="next()">Next</button></div><div id="res" class="card hide"><h2 id="score"></h2><div id="wrong"></div></div></div><script src="chapter8-performance.js"></script><script>
const S={right:`<svg viewBox="0 0 520 250"><rect x="110" y="90" width="190" height="110" rx="14" fill="#ffd166"/><circle cx="300" cy="145" r="8" fill="white"/><path d="M300 145 H450" stroke="#67d6ff" stroke-width="9"/><path d="M450 145 l-22 -16 v32z" fill="#67d6ff"/><text x="340" y="116" fill="#bcefff" font-size="20" font-weight="900">10 N</text></svg>`,left:`<svg viewBox="0 0 520 250"><rect x="220" y="90" width="190" height="110" rx="14" fill="#ffd166"/><circle cx="220" cy="145" r="8" fill="white"/><path d="M220 145 H65" stroke="#67d6ff" stroke-width="9"/><path d="M65 145 l22 -16 v32z" fill="#67d6ff"/><text x="115" y="116" fill="#bcefff" font-size="20" font-weight="900">6 N</text></svg>`,up:`<svg viewBox="0 0 520 250"><rect x="170" y="125" width="180" height="95" rx="14" fill="#ffd166"/><circle cx="260" cy="125" r="8" fill="white"/><path d="M260 125 V35" stroke="#69df96" stroke-width="9"/><path d="M260 35 l-16 22 h32z" fill="#69df96"/><text x="282" y="75" fill="#c6f7d6" font-size="20" font-weight="900">8 N</text></svg>`,points:`<svg viewBox="0 0 520 250"><rect x="130" y="70" width="260" height="130" rx="16" fill="#ffd166"/><circle cx="390" cy="135" r="10" fill="#67d6ff"/><text x="408" y="130" fill="white" font-size="18" font-weight="900">B</text><path d="M390 135 H470" stroke="#67d6ff" stroke-width="8"/><path d="M470 135 l-20 -14 v28z" fill="#67d6ff"/></svg>`};
const Q=[
{topic:"Magnitude",scene:"right",q:"What is the magnitude of the force shown?",opts:["10 N","Right","Point B","100 N"],a:0,exp:"10 N 是力的<strong>大小（magnitude）</strong>。"},
{topic:"Direction",scene:"right",q:"What is the direction of the force shown?",opts:["10 N","To the left","To the right","At the box"],a:2,exp:"箭头尖端向右，所以<strong>direction = to the right</strong>。"},
{topic:"Point of application",scene:"right",q:"Where is the point of application?",opts:["At the white dot on the box","At the arrowhead only","Anywhere inside the box","10 N"],a:0,exp:"力实际作用在物体上的位置叫<strong>point of application</strong>。"},
{topic:"Magnitude",scene:"left",q:"Which information tells you the magnitude?",opts:["The arrow points left","6 N","The yellow box","The arrowhead"],a:1,exp:"6 N 是数值加单位，表示 magnitude。"},
{topic:"Direction",scene:"left",q:"The 6 N force acts in which direction?",opts:["Upward","Downward","To the right","To the left"],a:3,exp:"箭头向左，所以 direction = left。"},
{topic:"Direction",scene:"up",q:"Which direction does the 8 N force act?",opts:["Upward","Downward","Left","Right"],a:0,exp:"箭头向上，因此 direction = upward。"},
{topic:"Magnitude",scene:"right",q:"A force arrow is labelled 10 N. What does 10 N describe?",opts:["Direction","Point of application","Magnitude","Shape"],a:2,exp:"10 N 描述 force magnitude。"},
{topic:"Direction",scene:"left",q:"Which feature of a force arrow mainly shows direction?",opts:["Its arrowhead","Its colour","The object colour","The unit N"],a:0,exp:"Direction 由<strong>arrowhead</strong>显示。"},
{topic:"Point of application",scene:"points",q:"The force arrow begins at point B. Which point is the point of application?",opts:["A","B","C","All three"],a:1,exp:"箭头开始并接触物体的位置就是 point of application。"},
{topic:"Magnitude",scene:"up",q:"Which answer correctly describes only the magnitude?",opts:["Upward","8 N","Top surface","Vertical"],a:1,exp:"8 N 是 magnitude。"},
{topic:"Point of application",scene:"points",q:"If the same force is applied at a different point, what definitely changes?",opts:["Magnitude","Point of application","Unit","Meaning of newton"],a:1,exp:"改变施力位置就是改变 point of application。"},
{topic:"Magnitude",scene:"left",q:"Which is the correct S.I. unit used when stating force magnitude?",opts:["kg","m","N","s"],a:2,exp:"Force 的单位是<strong>newton (N)</strong>。"},
{topic:"All",scene:"right",q:"Which description is the most complete?",opts:["10 N","To the right","10 N to the right, applied at the right side of the box","Applied to a box"],a:2,exp:"完整描述要包括 magnitude、direction 和 point of application。"},
{topic:"All",scene:"left",q:"Which set correctly identifies the force characteristics?",opts:["Magnitude 6 N; direction left; applied at left side","Magnitude left; direction 6 N","Magnitude 6 kg; direction right","Magnitude N; direction left"],a:0,exp:"6 N 是 magnitude，left 是 direction。"},
{topic:"All",scene:"up",q:"A student says, The force is 8 N. What important information is still missing?",opts:["Only the unit","Direction and point of application","Mass and density","Temperature"],a:1,exp:"8 N 只给了 magnitude，还缺 direction 和 point of application。"},
{topic:"Direction",scene:"right",q:"Two forces both have magnitude 10 N, but one points left and one right. Which characteristic is different?",opts:["Magnitude","Direction","Unit","Both have no force"],a:1,exp:"大小相同，方向不同，所以不同的是 direction。"},
{topic:"Point of application",scene:"points",q:"Two identical 5 N forces point right but act at different positions. Which characteristic differs?",opts:["Magnitude","Direction","Point of application","S.I. unit"],a:2,exp:"不同的是 point of application。"},
{topic:"All",scene:"right",q:"Which statement about force is correct?",opts:["Force has magnitude only","Force has direction only","Force can be described by magnitude, direction and point of application","Point of application is a unit"],a:2,exp:"Force 的三个核心特征是 magnitude、direction、point of application。"},
{topic:"Direction",scene:"up",q:"The number beside an arrow gives the direction. True or false?",opts:["True","False","Only sometimes","No answer"],a:1,exp:"数字加 N 表示 magnitude，不是 direction。"},
{topic:"All",scene:"points",q:"Which method is best for reading a force diagram?",opts:["Read number, arrow direction and contact point","Look only at colour","Look only at object size","Ignore the arrow"],a:0,exp:"读 force diagram 时要同时检查数值、箭头方向和作用点。"}
];
let order=[...Q],idx=0,score=0,wrong=[],attemptLog=[];
function start(){const nm=name.value.trim()||"Student",code=studentCode.value.trim(),cls=className.value.trim();if(!code){alert("Please enter Student ID.");return}CH8Performance.saveIdentity(code,nm,cls);idx=0;score=0;wrong=[];attemptLog=[];game.classList.remove("hide");res.classList.add("hide");render()}
function render(){if(idx>=order.length)return finish();const x=order[idx];scene.innerHTML=S[x.scene];question.textContent=x.q;opts.innerHTML="";x.opts.forEach((v,i)=>{const b=document.createElement("button");b.className="opt";b.textContent=v;b.onclick=()=>ans(i,b);opts.appendChild(b)});fb.classList.add("hide");next.classList.add("hide")}
function ans(c,b){const x=order[idx],bs=[...document.querySelectorAll(".opt")];bs.forEach(z=>z.disabled=true);bs[x.a].classList.add("good");const ok=c===x.a;if(ok)score++;else{b.classList.add("bad");wrong.push({...x,chosen:x.opts[c]})}attemptLog.push({question_id:String(idx+1),topic:x.topic,skill_type:/Direction|Point/i.test(x.topic)?"diagram":/All/i.test(x.topic)?"application":"concept",question_text:x.q,student_answer:x.opts[c],correct_answer:x.opts[x.a],is_correct:ok,explanation:x.exp});fb.classList.remove("hide");fb.innerHTML=`<b>${ok?"Correct":"Incorrect"}</b><br>正确答案：${x.opts[x.a]}<br>${x.exp}`;next.classList.remove("hide")}
function next(){idx++;render()}function finish(){game.classList.add("hide");res.classList.remove("hide");const p=Math.round(score/order.length*100);document.getElementById("score").textContent=`${score}/${order.length} · ${p}%`;const ident=CH8Performance.student();CH8Performance.submit({student_code:ident.student_code,student_name:ident.student_name,class_name:ident.class_name,module_code:"8.1B",module_title:"Magnitude, Direction & Point of Application",score,total_questions:order.length,percentage:p,question_results:attemptLog});document.getElementById("wrong").innerHTML=wrong.length?wrong.map((x,i)=>`<div class="wrong"><b>${i+1}. ${x.q}</b><br>Your answer: ${x.chosen}<br>Correct: ${x.opts[x.a]}<br>${x.exp}</div>`).join(""):"No wrong answers.";localStorage.setItem("f2sci_81b_last",JSON.stringify({score,total:order.length,p,date:new Date().toISOString()}))}
window.onload=()=>{studentCode.value=localStorage.getItem("ch8_student_code")||"";name.value=localStorage.getItem("ch8_student_name")||"";className.value=localStorage.getItem("ch8_class_name")||""}
</script></body></html>
