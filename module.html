<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chapter 8 Module</title><style>body{margin:0;background:#07111d;color:#f5f8fb;font-family:Inter,Segoe UI,Arial,sans-serif}.wrap{max-width:980px;margin:auto;padding:20px}.top,.card{border:1px solid #2c4d68;background:#0b1b2d;border-radius:18px;padding:16px;margin-bottom:14px}.start{display:flex;gap:8px;flex-wrap:wrap}input{padding:11px;border-radius:10px;border:1px solid #35556f;background:#091827;color:#fff}.btn,.opt{border:0;border-radius:10px;padding:11px 13px;font-weight:800;cursor:pointer}.btn{background:#68d4ff;color:#04111b}.opt{background:#10243b;color:#fff;border:1px solid #31516d;text-align:left}.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}.good{background:#153b2b!important}.bad{background:#3b1d26!important}.scene{height:300px;display:grid;place-items:center}.scene svg{max-width:100%;height:270px}.fb{margin-top:10px;padding:12px;border-radius:12px;background:#0b2034;line-height:1.6}.hide{display:none}.wrong{margin:8px 0;padding:12px;border:1px solid #304d66;border-radius:12px}.small{color:#a9bfd3}@media(max-width:700px){.opts{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="top"><div class="small">FORM 2 SCIENCE · CHAPTER 8</div><h1 id="moduleTitle">Loading...</h1><p id="subtitle">English questions · 华语详细解释</p><div class="start"><input id="studentCode" placeholder="Student ID"><input id="studentName" placeholder="Student name"><input id="className" placeholder="Class"><button class="btn" onclick="startQuiz()">Start</button></div></div><div id="game" class="card hide"><div id="scene" class="scene"></div><div class="small">Question <span id="num"></span> · Score <span id="liveScore">0</span></div><h2 id="question"></h2><div id="opts" class="opts"></div><div id="fb" class="fb hide"></div><button id="nextBtn" class="btn hide" onclick="nextQ()">Next</button></div><div id="res" class="card hide"><h2 id="resultScore"></h2><div id="wrongBox"></div></div></div><script src="chapter8-performance.js"></script><script>
let D=null,idx=0,scoreVal=0,wrongList=[],attemptLog=[];const el=id=>document.getElementById(id);const code=new URLSearchParams(location.search).get('code')||'8.1D';const scr=document.createElement('script');scr.src='data/'+encodeURIComponent(code)+'.js';scr.onload=init;scr.onerror=()=>el('moduleTitle').textContent='Module data not found';document.head.appendChild(scr);
function init(){D=window.CH8_MODULE_DATA;el('moduleTitle').textContent=D.code+' — '+D.title;document.title='Form 2 Science '+D.code+' — '+D.title;el('studentCode').value=localStorage.getItem('ch8_student_code')||'';el('studentName').value=localStorage.getItem('ch8_student_name')||'';el('className').value=localStorage.getItem('ch8_class_name')||''}
function startQuiz(){const nm=el('studentName').value.trim()||'Student',sid=el('studentCode').value.trim(),cls=el('className').value.trim();if(!sid){alert('Please enter Student ID.');return}CH8Performance.saveIdentity(sid,nm,cls);idx=0;scoreVal=0;wrongList=[];attemptLog=[];el('game').classList.remove('hide');el('res').classList.add('hide');render()}
function render(){if(idx>=D.questions.length)return finish();const x=D.questions[idx];el('num').textContent=(idx+1)+'/'+D.questions.length;el('liveScore').textContent=scoreVal;el('scene').innerHTML=D.scenes[x.scene]||x.svg||'';el('question').textContent=x.q;el('opts').innerHTML='';x.opts.forEach((v,i)=>{const b=document.createElement('button');b.className='opt';b.textContent=v;b.onclick=()=>ans(i,b);el('opts').appendChild(b)});el('fb').classList.add('hide');el('nextBtn').classList.add('hide')}
function skill(x){const t=(x.topic||'')+' '+(x.q||'');if(/calcul|calculate|moment|pressure.*\d/i.test(t))return'calculation';if(/reading|direction|point|diagram|shown/i.test(t))return'diagram';if(/application|analysis|reasoning|misconception|all|mixed/i.test(t))return'application';return'concept'}
function ans(c,b){const x=D.questions[idx],bs=[...document.querySelectorAll('.opt')];bs.forEach(z=>z.disabled=true);bs[x.a].classList.add('good');const ok=c===x.a;if(ok)scoreVal++;else{b.classList.add('bad');wrongList.push({...x,chosen:x.opts[c]})}attemptLog.push({question_id:String(idx+1),topic:x.topic||'',skill_type:skill(x),question_text:x.q,student_answer:x.opts[c],correct_answer:x.opts[x.a],is_correct:ok,explanation:x.exp});el('fb').classList.remove('hide');el('fb').innerHTML=`<b>${ok?'Correct · 答对了':'Incorrect · 答错了'}</b><br><b>正确答案：</b> ${x.opts[x.a]}<br><b>详细解释：</b> ${x.exp}`;el('nextBtn').classList.remove('hide');el('liveScore').textContent=scoreVal}
function nextQ(){idx++;render()}
function finish(){el('game').classList.add('hide');el('res').classList.remove('hide');const p=Math.round(scoreVal/D.questions.length*100);el('resultScore').textContent=`${scoreVal}/${D.questions.length} · ${p}%`;const ident=CH8Performance.student();CH8Performance.submit({student_code:ident.student_code,student_name:ident.student_name,class_name:ident.class_name,module_code:D.code,module_title:D.title,score:scoreVal,total_questions:D.questions.length,percentage:p,question_results:attemptLog});el('wrongBox').innerHTML=wrongList.length?wrongList.map((x,i)=>`<div class="wrong"><b>${i+1}. ${x.q}</b><br>Your answer: ${x.chosen}<br><b>Correct:</b> ${x.opts[x.a]}<br>${x.exp}</div>`).join(''):'No wrong answers.';localStorage.setItem('ch8_'+D.code+'_last',JSON.stringify({score:scoreVal,total:D.questions.length,p,date:new Date().toISOString()}))}
</script></body></html>
